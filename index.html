<style>
  :root{--ui-bg:#f3f4f6;--ui-panel:#fff;--ui-border:#d1d5db;--accent:#0f766e}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--ui-bg);color:#111}
  #app{display:flex;min-height:100vh}
  #panel{width:400px;flex:0 0 400px;background:var(--ui-panel);border-right:1px solid var(--ui-border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
  #panel header{padding:12px 14px 8px;border-bottom:1px solid var(--ui-border)}
  #panel h1{font-size:17px;margin:0}
  #panel .sub{font-size:11px;color:#555;margin:2px 0 0}
  #tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--ui-border);background:#fafafa}
  #tabs button{padding:5px 8px;font-size:11.5px;border-radius:14px;border:1px solid var(--ui-border);background:#fff;font-weight:600;cursor:pointer}
  #tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #form{padding:10px 14px 20px;overflow-y:auto;flex:1}
  fieldset{border:1px solid var(--ui-border);border-radius:8px;margin:0 0 12px;padding:8px 12px 12px}
  legend{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);padding:0 4px}
  label{display:block;font-size:11.5px;font-weight:600;margin:8px 0 3px;color:#333}
  input[type=text],input[type=number],textarea,select{width:100%;padding:6px 8px;border:1px solid var(--ui-border);border-radius:6px;font-size:13px;font-family:inherit;background:#fff}
  input[type=color]{width:100%;height:32px;padding:2px;border:1px solid var(--ui-border);border-radius:6px;background:#fff}
  input[type=range]{width:100%}
  textarea{resize:vertical;min-height:50px}
  .row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1;min-width:0}
  .check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;margin:8px 0 0}
  .check input{width:auto;margin:0}.check label{margin:0;font-weight:500}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:flex-end}
  button{cursor:pointer;border:1px solid var(--ui-border);background:#fff;border-radius:6px;padding:7px 11px;font-size:12.5px;font-weight:600}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.small{padding:4px 7px;font-size:11.5px;font-weight:500}
  button.icon{padding:3px 6px;font-size:12px;line-height:1;font-weight:700}
  button.danger{color:#b91c1c}
  button svg{vertical-align:-2px;margin-right:4px}
  button.icon svg,button.small.io svg{margin:0}
  button.icon{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0}
  .hint{font-size:11px;color:#666;margin-top:4px;line-height:1.4}
  .list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .item{display:flex;gap:4px;align-items:center}
  .item input[type=text]{flex:1;padding:4px 6px;font-size:12px}
  .item input.w{width:52px;flex:0 0 52px;padding:4px 4px;font-size:12px}
  .item select{width:auto;flex:0 0 auto;padding:4px 4px;font-size:11.5px}
  .item .n{font-size:11px;color:#888;width:16px;text-align:right}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
  .chip{padding:3px 8px;font-size:11px;border-radius:12px;font-weight:600}
  .chip span{opacity:.6;font-weight:500}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip.on span{opacity:.85}
  .tpl{border:1px solid var(--ui-border);border-radius:8px;padding:10px 12px;margin-top:8px;background:#fff}
  .tpl.on{border-color:var(--accent);box-shadow:0 0 0 2px #0f766e22}
  .tpl b{font-size:13px}.tpl p{font-size:11.5px;color:#555;margin:4px 0 8px;line-height:1.4}
  #footer{padding:10px 14px;border-top:1px solid var(--ui-border);background:#fafafa}
  #modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:center;justify-content:center;z-index:1000}
  #modal.open{display:flex}
  #modal .dlg{background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:min(420px,92vw);padding:20px 22px 18px;animation:pop .15s ease-out}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  #modal .dt{font-size:16px;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:8px}
  #modal .dt svg{width:20px;height:20px;color:var(--accent)}
  #modal .dt.warn svg{color:#b45309}
  #modal .dm{font-size:13.5px;color:#374151;line-height:1.5;margin:0 0 16px}
  #modal .db{display:flex;justify-content:flex-end;gap:8px}
  #modal button.danger{background:#b91c1c;color:#fff;border-color:#b91c1c}
  #main{flex:1;padding:16px;overflow:auto}

const TOWN_ADDR="Brewerville City\nMontserrado County, Liberia";
const STD_PANELS=(ym)=>({ fl:{type:"pledge"}, fr:{type:"cover"}, bl:{type:"table",yearMode:ym||"blank"}, br:{type:"table",yearMode:ym||"blank"} });
const C=(name,w)=>({name,w});
const NUM=(n,pre="")=>Array.from({length:n},(_,i)=>pre+(i+1));
/* due/record card factory */
function DUE(id,cat,name,desc,o){
  TEMPLATES[id]={cat,name,desc,settings:{
    layout:Object.assign({color:o.color||"#ffffff"},o.layout||{}),
    panels:o.panels||STD_PANELS(o.yearMode),
    pledge:Object.assign({head:"MY PLEDGE",textSize:12,align:"justify"},o.pledge||{}),
    cover:Object.assign({org:o.org,addr:o.addr||TOWN_ADDR,title:o.title,motto:o.motto||"",fields:o.fields||[LINE("Name:"),LINE("Card #:","cardno"),SIGNED("SECRETARY")]},o.cover||{}),
    table:Object.assign({head:o.tableHead||"MONTHLY RECORD {year}",cols:o.cols||[C("MONTH",34),C("DUE",30),C("SIGN",36)],rows:o.rows||MONTHS12},o.table||{}),
    grid:o.grid, numbering:o.numbering, report:o.report }};
}
/* booklet factory (grid pages + inner sheet) */
function BOOK(id,cat,name,desc,o){
  DUE(id,cat,name,desc,Object.assign({},o,{
    panels:{ fl:{type:o.leftPage||"pledge"}, fr:{type:"cover"}, bl:{type:"grid"}, br:{type:"grid"}, il:{type:"grid"}, ir:{type:"grid"} },
    numbering:{innerSheets:o.inner??1},
    grid:Object.assign({layout:"side",tables:1,rows:14,rotate:false,title:"",titleSize:9},o.grid||{}) }));
}
/* report card factory */
function RPT(id,name,desc,o){
  TEMPLATES[id]={cat:"school",name,desc,settings:{ layout:RPT_LAYOUT, panels:RPT_PANELS, report:Object.assign({},RPT_SIZES,{addr:SCHOOL_ADDR},o) }};
}

/* modal dialog: askModal({title,msg,ok,cancel,danger,warn}) -> Promise<boolean>; infoModal(title,msg) */
const M=document.getElementById("modal");
function askModal(o){ return new Promise(res=>{
  document.getElementById("mTitle").innerHTML=(o.warn||o.danger?I.alert:I.question)+esc(o.title||"Please confirm");
  document.getElementById("mTitle").className="dt"+(o.warn||o.danger?" warn":"");
  document.getElementById("mMsg").innerHTML=o.msg||"";
  const bx=document.getElementById("mBtns"); bx.innerHTML="";
  const close=v=>{ M.classList.remove("open"); document.removeEventListener("keydown",onKey); res(v); };
  const onKey=e=>{ if(e.key==="Escape") close(false); if(e.key==="Enter") close(true); };
  if(o.cancel!==null){ const c=document.createElement("button"); c.textContent=o.cancel||"Cancel"; c.onclick=()=>close(false); bx.appendChild(c); }
  const k=document.createElement("button"); k.className=o.danger?"danger":"primary"; k.innerHTML=(o.icon||"")+esc(o.ok||"OK"); k.onclick=()=>close(true); bx.appendChild(k);
  M.onclick=e=>{ if(e.target===M) close(false); };
  document.addEventListener("keydown",onKey);
  M.classList.add("open"); k.focus();
});}
const infoModal=(title,msg)=>askModal({title,msg,ok:"OK",cancel:null});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* every template (built‑in or user) as {id,name,desc,settings,builtin,modified} */
function allTemplates(){
  const ov=overrides();
  const b=Object.entries(TEMPLATES).map(([id,t])=>{ const o=ov[id]||{}; const base=t.settings.deco?t.settings:Object.assign({},t.settings,{deco:autoDeco(id,t.cat||"other")}); return {id, cat:t.cat||"other", name:o.name??t.name, desc:o.desc??t.desc, settings:o.settings??Object.assign({template:id},base), builtin:true, modified:!!ov[id]}; });
  const u=userTemplates().map(t=>({id:t.id||("u_"+t.name), cat:"mine", name:t.name, desc:t.desc||"", settings:t.settings, builtin:false}));
  return b.concat(u);
}
function getTemplate(id){ return allTemplates().find(t=>t.id===id); }
function updateTemplate(id,patch){
  if(TEMPLATES[id]){ const ov=overrides(); const cur=getTemplate(id); ov[id]=Object.assign({name:cur.name,desc:cur.desc,settings:cur.settings},ov[id]||{},patch); saveOverrides(ov); }
  else { const list=userTemplates(); const i=list.findIndex(t=>(t.id||("u_"+t.name))===id); if(i>=0){ Object.assign(list[i],patch); saveUserTemplates(list);} }
}

function panelEditor(id,label){
  const p=S.panels[id];
  return `<div style="border:1px solid var(--ui-border);border-radius:6px;padding:6px 8px 8px;margin-top:8px">

function renderTabs(){ document.getElementById("tabs").innerHTML = TABS.map(([id,l])=>`<button class="${tab===id?"on":""}" data-tab="${id}">${l}</button>`).join(""); }
function renderForm(){ document.getElementById("form").innerHTML = formHTML(); }

/* ---- form events (delegated) ---- */
const form=document.getElementById("form");
form.addEventListener("input", e=>{
  const el=e.target, p=el.dataset.p; if(!p) return;
  let v; if(el.dataset.t==="bool") v=el.checked; else if(el.dataset.t==="num") v=el.value===""?"":Number(el.value); else v=el.value;
  set(S,p,v); save(); render();
  if(p==="deco.on"){ renderForm(); return; }
  if(el.type==="range"){ const lab=el.previousElementSibling; if(lab) lab.textContent=lab.textContent.replace(/\(.*\)$/,`(${v})`); }
});
form.addEventListener("input", e=>{
  const el=e.target;
  if(el.id==="tplSearch"){ tplQ=el.value; const pos=el.selectionStart; renderForm(); const n=document.getElementById("tplSearch"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(!el.dataset.tf) return;
  updateTemplate(el.dataset.id,{[el.dataset.tf]:el.value});
});
form.addEventListener("change", e=>{
  const el=e.target, p=el.dataset.p;
  if(el.id==="tplFile"){ const f=el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(d.overrides) saveOverrides(Object.assign(overrides(),d.overrides));
      if(Array.isArray(d.user)){ const list=userTemplates(); d.user.forEach(t=>{ const i=list.findIndex(x=>x.id===t.id); if(i>=0) list[i]=t; else list.push(t); }); saveUserTemplates(list); }
      renderForm(); infoModal("Templates imported","The templates from the file were added to your library."); }catch(err){ infoModal("Invalid file","That file is not a Due Book template library."); } }; r.readAsText(f); return; }
  if(p && (/^panels\.\w+\.(type|yearMode)$/.test(p) || p==="grid.layout")) renderForm();
  if(el.id==="logoFile"){ const f=el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{S.cover.logo=r.result;save();render();}; r.readAsDataURL(f); }
});
form.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return; e.preventDefault();
  if(b.id==="logoClear"){ S.cover.logo=""; save(); render(); return; }
  const act=b.dataset.act; if(!act) return;
  if(act==="tpl-cat"){ tplCat=b.dataset.id; renderForm(); return; }
  if(act==="deco-style"){ S.deco.style=b.dataset.id; save(); renderForm(); render(); return; }
  if(act==="deco-pal"){ const p=DECO_PALETTES[+b.dataset.i]; S.deco.c1=p[1]; S.deco.c2=p[2]; save(); renderForm(); render(); return; }
  if(act==="tpl-use"){ const t=getTemplate(b.dataset.id); if(!t) return;
    const cur=getTemplate(S.template);
    askModal({title:S.template===t.id?"Reload template":"Switch template", warn:true,
      msg:`Open <b>${esc(t.name)}</b> in the editor?<br><br>The design you are working on now${cur?` (<b>${esc(cur.name)}</b>)`:""} will be replaced. If you want to keep your changes, close this and click <b>Save design here</b> on its template first.`,
      ok:S.template===t.id?"Reload":"Switch", icon:I.check})
      .then(y=>{ if(y) loadTemplate(Object.assign({}, t.settings, {template:t.id})); }); return; }
  if(act==="tpl-update"){ const t=getTemplate(b.dataset.id); if(!t) return;
    askModal({title:"Save design into template", msg:`Store the design currently in the editor into <b>${esc(t.name)}</b>?<br>Its previous contents will be overwritten.`, ok:"Save", icon:I.save})
      .then(y=>{ if(y){ updateTemplate(t.id,{settings:Object.assign(clone(S),{template:t.id})}); S.template=t.id; save(); renderForm(); } }); return; }
  if(act==="tpl-reset"){ const t=getTemplate(b.dataset.id); if(!t) return;
    askModal({title:"Restore original", warn:true, msg:`Restore <b>${esc(t.name)}</b> to the original built‑in version? Your edits to this template will be lost.`, ok:"Restore", icon:I.reset})
      .then(y=>{ if(y){ const ov=overrides(); delete ov[t.id]; saveOverrides(ov); renderForm(); } }); return; }
  if(act==="tpl-del"){ const t=getTemplate(b.dataset.id); if(!t) return;
    askModal({title:"Delete template", danger:true, msg:`Delete <b>${esc(t.name)}</b> permanently?`, ok:"Delete", icon:I.trash})
      .then(y=>{ if(y){ saveUserTemplates(userTemplates().filter(x=>(x.id||("u_"+x.name))!==t.id)); renderForm(); } }); return; }
  if(act==="tpl-dup"){ const t=getTemplate(b.dataset.id); if(!t) return; const id="u_"+Date.now(); const list=userTemplates(); list.push({id,name:t.name+" (copy)",desc:t.desc,settings:Object.assign(clone(t.settings),{template:id})}); saveUserTemplates(list); renderForm(); return; }
  if(act==="tpl-new"){ const name=(document.getElementById("tplName").value||"").trim(); if(!name){ infoModal("Name required","Type a name for the new template first."); return; }
    const id="u_"+Date.now(); const list=userTemplates(); list.push({id,name,desc:"",settings:Object.assign(clone(S),{template:id})}); saveUserTemplates(list); S.template=id; save(); renderForm(); return; }
  if(act==="tpl-export"){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify({overrides:overrides(),user:userTemplates()},null,2)],{type:"application/json"})); a.download="duebook-templates.json"; a.click(); return; }
  if(act==="tpl-import"){ document.getElementById("tplFile").click(); return; }
  if(act==="months"){ S.table.rows=MONTHS.slice(); }
  else if(act==="numbers"){ S.table.rows=Array.from({length:12},(_,i)=>String(i+1)); }
  else if(act==="gridreset"){ Object.assign(S.grid, clone(DEFAULTS.grid)); }
  else {
    const arr=get(S,b.dataset.arr), i=Number(b.dataset.i);
    if(act==="add"){
      if(b.dataset.arr==="cover.fields") arr.push({label:"Name:",after:"",pos:"under",fill:"none"});
      else if(b.dataset.arr==="table.cols"||b.dataset.arr==="grid.cols"||b.dataset.arr==="report.signCols") arr.push({name:"NEW",w:12});
      else arr.push("");
    } else if(act==="del"){ if(arr.length>1) arr.splice(i,1); }
    else if(act==="up"){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; }
    else if(act==="down"){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; }
  }
  save(); renderForm(); render();
});
document.getElementById("tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; tab=b.dataset.tab; renderTabs(); renderForm(); });

/* ===================== CARD RENDERING ===================== */
const sheetCount=()=>Math.max(1,Math.min(300,parseInt(S.numbering.sheets)||1));
const innerSheets=()=>Math.max(0,Math.min(12,parseInt(S.numbering.innerSheets)||0));
const perSheet=()=>Math.max(1,Math.min(6,parseInt(S.layout.perSheet)||3));
function physList(){ const L=[]; for(let s=0;s<sheetCount();s++){ L.push({set:s,kind:"cover"}); for(let i=0;i<innerSheets();i++) L.push({set:s,kind:"inner",i}); } return L; }
function cardNumber(idx){ const n=S.numbering; if(!n.autoNo) return ""; return (n.prefix||"")+String((parseInt(n.startNo)||0)+idx).padStart(parseInt(n.pad)||0,"0"); }
function churchFor(idx){ return (S.numbering.churches||"").split("\n").map(s=>s.trim()).filter(Boolean)[idx]||""; }
const pt=v=>`calc(${(Number(v)||10)*(Number(S.layout.fs)||1)}pt * var(--k,1))`;
const pad=()=>`padding:${S.layout.padY}mm ${S.layout.padX}mm;`;

function pledgePanel(){ const p=S.pledge; return `<div class="panel pledge" style="${pad()}justify-content:${p.valign}">
  <h2 class="${p.underline?"u":""}" style="font-size:${pt(p.headSize)};text-align:${p.align==="center"?"center":"left"}">${esc(p.head)}</h2>
  <p style="font-size:${pt(p.textSize)};text-align:${p.align};text-align-last:${p.align==="justify"?"left":p.align}">${esc(p.text)}</p></div>`; }

function coverPanel(idx){ const c=S.cover;
  const fields=c.fields.map(f=>{ let val=""; if(f.fill==="cardno") val=cardNumber(idx); else if(f.fill==="church") val=churchFor(idx);
    const top=`${f.label?`<span class="lab">${esc(f.label)}</span>`:""}<span class="line"><span class="val">${esc(val)}</span></span>`;
    if(f.after && (f.pos||"under")==="under")
      return `<div class="field stack" style="font-size:${pt(c.fieldSize)}"><div class="top">${top}</div><div class="under" style="padding-left:${f.label?Math.max(2,(f.label||"").length*0.55):0}em">${esc(f.after)}</div></div>`;
    return `<div class="field" style="font-size:${pt(c.fieldSize)}">${top}${f.after?`<span class="after">${esc(f.after)}</span>`:""}</div>`; }).join("");
  return `<div class="panel cover" style="${pad()}"><div class="box ${c.box?"b":""}" style="--box-w:${c.boxW}mm">
    ${c.logo?`<img class="logo" src="${c.logo}" style="height:${c.logoH}mm;max-width:80%;object-fit:contain" alt="">`:""}
    ${c.org?`<p class="org" style="font-size:${pt(c.orgSize)};text-transform:${c.orgCase==="upper"?"uppercase":"none"}">${esc(c.org)}</p>`:""}
    ${c.addr?`<p class="addr" style="font-size:${pt(c.addrSize)};${c.addrItalic?"font-style:italic;font-weight:700;":""}">${esc(c.addr)}</p>`:""}
    ${c.title?`<p class="title" style="font-size:${pt(c.titleSize)}">${esc(c.title)}</p>`:""}
    <div class="fields">${fields}</div>
    ${c.motto?`<p class="motto" style="font-size:${pt(c.mottoSize)};text-align:${c.mottoAlign||"center"};${c.mottoBold?"font-weight:800;":""}">${esc(c.motto)}</p>`:""}
  </div></div>`; }

function yearHTML(p){ const t=S.table; const mode=p.yearMode||"blank";
  if(mode==="none") return "";
  if(mode==="fixed") return esc(p.year??"");
  return `<span class="yr" style="font-size:${pt(t.yearSize)}">${esc(t.yearLabel||"")}${t.yearLabel?" ":""}<span class="yline" style="width:${t.yearLine}mm"></span></span>`; }
function tablePanel(idx,p){ const t=S.table; const mode=p.yearMode||"blank";
  const tw=t.cols.reduce((a,c)=>a+(Number(c.w)||1),0);
  const cols=`<colgroup>${t.cols.map(c=>`<col style="width:${(Number(c.w)||1)/tw*100}%">`).join("")}</colgroup>`;
  const head=t.showHeader?`<thead><tr>${t.cols.map(c=>`<th class="${t.thFill?"fill":""}">${esc(c.name)}</th>`).join("")}</tr></thead>`:"";
  const rows=t.rows.map(r=>`<tr><td class="m" style="text-align:${t.rowAlign}">${esc(r)}</td>${t.cols.slice(1).map(()=>"<td></td>").join("")}</tr>`).join("");
  const y=yearHTML(p); const hasTag=/\{year\}/.test(t.head||"");
  let heading, yearLine="";
  if(t.yearPos==="inline" || mode!=="blank"){ heading=esc(t.head||"").replace(/\{year\}/g,y).replace(/\s{2,}/g," ").trim(); }
  else { heading=esc(t.head||"").replace(/\{year\}/g,"").replace(/\s{2,}/g," ").trim(); if(hasTag) yearLine=`<div class="yrow" style="text-align:${t.yearPos==="right"?"right":"center"}">${y}</div>`; }
  return `<div class="panel records" style="${pad()}--tbl-w:${t.lineW}mm;--th-bg:${t.thBg||"transparent"};--th-fs:${pt(t.headerSize)};--td-fs:${pt(t.cellSize)}">
    ${heading?`<h3 style="font-size:${pt(t.headSize)}">${heading}</h3>`:""}${yearLine}
    <table>${cols}${head}<tbody>${rows}</tbody></table>
    ${t.note?`<div style="font-size:${pt(t.noteSize)};margin-top:1mm">${esc(t.note)}</div>`:""}
    ${t.cardNo&&cardNumber(idx)?`<div class="cardno">Card # ${esc(cardNumber(idx))}</div>`:""}
  </div>`; }

function gridPanel(){ const g=S.grid;
  const tw=g.cols.reduce((a,c)=>a+(Number(c.w)||1),0);
  const cols=`<colgroup>${g.cols.map(c=>`<col style="width:${(Number(c.w)||1)/tw*100}%">`).join("")}</colgroup>`;
  const head=`<thead><tr>${g.cols.map((c,i)=>`<th class="${g.rotate&&i>0?"rot":""} ${g.thFill?"fill":""} ${i>0&&!g.rotate?"c":""}"><span>${esc(c.name)}</span></th>`).join("")}</tr></thead>`;
  const n=Math.max(1,Math.min(40,parseInt(g.rows)||13));
  const body=`<tbody>${Array.from({length:n},()=>`<tr>${g.cols.map((_,i)=>`<td class="${i===0?"first":""}"></td>`).join("")}</tr>`).join("")}</tbody>`;
  let tables, stacked=(g.layout||"stacked")==="stacked";
  const nT=Math.max(1,Math.min(4,parseInt(g.tables)||1));
  if(stacked){
    const nb=Math.max(1,Math.min(20,parseInt(g.blankCols)||7));
    const lw=Math.max(5,Math.min(70,Number(g.labelW)||26));
    const cg=`<colgroup><col style="width:${lw}%">${Array.from({length:nb},()=>`<col style="width:${(100-lw)/nb}%">`).join("")}</colgroup>`;
    const labels=g.cols.map(c=>c.name);
    let trs="";
    labels.forEach((name,i)=>{
      if(i===0 && g.monthRow){ trs+=`<tr><td class="mrow" colspan="${nb+1}">${esc(name)}<span class="ml"></span></td></tr>`; return; }
      trs+=`<tr><td class="lab">${esc(name)}</td>${Array.from({length:nb},()=>"<td></td>").join("")}</tr>`;
    });
    tables=Array.from({length:nT},()=>`<table>${cg}<tbody>${trs}</tbody></table>`).join("");
  } else {
    tables=Array.from({length:nT},()=>`<table>${cols}${head}${body}</table>`).join("");
  }
  return `<div class="panel grid" style="${pad()}--tbl-w:${g.lineW}mm;--th-bg:${g.thBg||"transparent"};--th-fs:${pt(g.headerSize)};--td-fs:${pt(g.cellSize)};--gpad:${g.pad}mm;--ggap:${g.gap}mm;--box-w:${g.boxW}mm">
    <div class="gbox ${g.box?"b":""}">
      ${g.title?`<div class="gtitle" style="font-size:${pt(g.titleSize)}">${esc(g.title)}</div>`:""}
      <div class="gtables ${stacked?"stacked":""}">${tables}</div>
      ${g.note?`<div class="gnote" style="font-size:${pt(g.cellSize)}">${esc(g.note)}</div>`:""}
    </div></div>`; }

const blanks=t=>esc(t).replace(/_{3,}/g,m=>`<span class="bl" style="width:${Math.min(80,m.length*2.2)}mm"></span>`);
function rcoverPanel(){ const R=S.report;
  const rows=(R.fields||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>`<div class="frow" style="font-size:${pt(R.fieldSize)}">${l.split("|").map(f=>`<span class="f"><span class="lab">${esc(f.trim())}</span><span class="line"></span></span>`).join("")}</div>`).join("");
  const tw=R.signCols.reduce((a,c)=>a+(Number(c.w)||1),0);
  const tbl=`<table class="${R.signFill?"fill":""}" style="font-size:${pt(R.signSize)}"><colgroup>${R.signCols.map(c=>`<col style="width:${(Number(c.w)||1)/tw*100}%">`).join("")}</colgroup>
    <thead><tr>${R.signCols.map(c=>`<th>${esc(c.name)}</th>`).join("")}</tr></thead>
    <tbody>${R.signRows.map(r=>`<tr><td>${esc(r)}</td>${R.signCols.slice(1).map(()=>"<td></td>").join("")}</tr>`).join("")}</tbody></table>`;
  return `<div class="panel rc" style="${pad()}--box-w:${R.boxW}mm;--gap:${R.cGap??2}mm;--rowh:${R.signRowH||6}mm"><div class="box ${R.box?"b":""} ${R.signFill?"":"spread"}">
    <div class="hdr">
      <p class="org" style="font-size:${pt(R.schoolSize)}">${esc(R.school)}</p>
      <p class="addr" style="font-size:${pt(R.addrSize)}">${esc(R.addr)}</p>
      <p class="title" style="font-size:${pt(R.titleSize)}">${esc(R.title)}</p>
    </div>
    <div class="fields">${rows}</div>
    <div class="sign">
      ${R.signHead?`<p class="sh" style="font-size:${pt(R.fieldSize)}">${esc(R.signHead)}</p>`:""}
      ${R.signNote?`<p class="sn" style="font-size:${pt(R.noteSize)};text-align:${R.signNoteAlign||"left"}">${esc(R.signNote)}</p>`:""}
      ${tbl}
    </div>
    <div class="foot">
      ${R.note?`<p class="note" style="font-size:${pt(R.noteSize)};text-align:${R.noteAlign||"justify"}">${esc(R.note)}</p>`:""}
      ${R.motto?`<p class="motto ${R.mottoRule?"rule":""}" style="font-size:${pt(R.mottoSize)}">${esc(R.motto)}</p>`:""}
    </div>
  </div></div>`; }
function promoPanel(){ const R=S.report; const fs=pt(R.pSize);
  return `<div class="panel rc" style="${pad()}--box-w:${R.boxW}mm;font-size:${fs}"><div class="box ${R.box?"b":""}">
    <p class="org" style="font-size:${pt(R.schoolSize)}">${esc(R.school)}</p>
    <p class="ptitle" style="font-size:${pt(R.pTitleSize)}">${esc(R.pTitle)}</p>
    ${R.pIntro?`<p class="pintro">${esc(R.pIntro)}</p>`:""}
    <p class="pbody">${blanks(R.pBody)}</p>
    <ul class="popt">${R.pOptions.map(o=>`<li>${blanks(o)}</li>`).join("")}</ul>
    <div class="psig">${R.pSigns.map(t=>`<div class="sg"><div class="ln"></div>${esc(t)}</div>`).join("")}</div>
    ${R.pDate?`<p class="pdate">${blanks(R.pDate)}</p>`:""}
    ${R.pNote?`<p class="pnote">${esc(R.pNote)}</p>`:""}
  </div></div>`; }
function gradesPanel(side){ const R=S.report;
  const n1=R.sem1Cols.length, n2=R.sem2Cols.length, sw=Math.max(10,Math.min(60,Number(R.subjW)||24));
  const rows=R.subjects;
  let t;
  if(side==="left"){
    t=`<table><colgroup><col style="width:${sw}%">${R.sem1Cols.map(()=>`<col style="width:${(100-sw)/n1}%">`).join("")}</colgroup>
      <thead><tr><th class="sem" style="border:none"></th><th class="sem" colspan="${n1}">${esc(R.sem1)}</th></tr>
      <tr><th class="sub col">${esc(R.subjHead)}</th>${R.sem1Cols.map(c=>`<th class="col">${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(sj=>`<tr><td class="s">${esc(sj)}</td>${R.sem1Cols.map(()=>"<td></td>").join("")}</tr>`).join("")}</tbody></table>`;
  } else {
    t=`<table><colgroup>${R.sem2Cols.map(()=>`<col>`).join("")}</colgroup>
      <thead><tr><th class="sem" colspan="${n2}">${esc(R.sem2)}</th></tr>
      <tr>${R.sem2Cols.map(c=>`<th class="col">${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(()=>`<tr>${R.sem2Cols.map(()=>"<td></td>").join("")}</tr>`).join("")}</tbody></table>`;
  }
  const foot=side==="left"
    ?`<div class="scale" style="font-size:${pt(R.scaleSize)}">${esc(R.scale)}</div>`
    :(R.gNote?`<div class="gn" style="font-size:${pt(R.scaleSize)};margin-left:auto">${esc(R.gNote)}</div>`:"");
  return `<div class="panel gr" style="${pad()}--tbl-w:${R.gLineW}mm;--g-fs:${pt(R.gSize)};--gh-fs:${pt(R.gHeadSize)}">
    <div class="gwrap" style="flex:0 0 ${Math.max(40,Math.min(95,Number(R.gFill)||78))}%">${t}</div>
    <div class="gfoot">${foot}</div>
  </div>`; }
function customPanel(p){ return `<div class="panel free" style="${pad()};justify-content:center">
  ${p.custom.head?`<h3 style="font-size:${pt(14)}">${esc(p.custom.head)}</h3>`:""}
  <p style="font-size:${pt(11)}">${esc(p.custom.body)}</p></div>`; }

function panel(id,idx,right){ const p=S.panels[id]; let html;
  switch(p.type){ case "pledge":html=pledgePanel();break; case "cover":html=coverPanel(idx);break; case "table":html=tablePanel(idx,p);break; case "grid":html=gridPanel();break; case "rcover":html=rcoverPanel();break; case "promo":html=promoPanel();break; case "grades":html=gradesPanel(right?"right":"left");break; case "custom":html=customPanel(p);break; default:html=`<div class="panel" style="${pad()}"></div>`; }
  html=decorate(html,id);
  html=html.replace('class="panel','data-pid="'+id+'" class="panel'); return right?html.replace('class="panel','class="panel rl'):html; }

function card(ps,side,slot){
  const L=S.layout,n=perSheet();
  const gap=n>1?(L.pageH-2*L.marginTop-n*L.cardH)/(n-1):0;
  const top=L.marginTop+slot*(L.cardH+gap), left=(L.pageW-L.cardW)/2;
  const idx=ps.set*n+slot;
  const [l,r]=ps.kind==="inner"?["il","ir"]:(side==="front"?["fl","fr"]:["bl","br"]);
  return `<div class="card ${L.cardBorder>0?"border":""}" style="left:${left}mm;top:${top}mm;width:${L.cardW}mm;height:${L.cardH}mm">${panel(l,idx,false)}${panel(r,idx,true)}<div class="fold"></div></div>`;
}
function sheetHTML(ps,side){
  const L=S.layout,n=perSheet();
  const cards=Array.from({length:n},(_,j)=>card(ps,side,j)).join("");
  const vars=`--card-bg:${L.color};--ink:${L.ink};--line:${L.line};--font:${L.font};--card-border:${L.cardBorder}mm;--divider:${L.divider}mm`;
  const name=ps.kind==="cover"?"Cover sheet":`Inner sheet ${ps.i+1}`;
  return `<div class="sheetHolder"><p class="cap">Set ${ps.set+1} · ${name} – ${side==="front"?"FRONT":"BACK"}${ps.kind==="cover"?(side==="front"?" (outside)":" (inside)"):""}</p>
    <div class="scaleBox"><div class="sheet ${L.guides?"cut":""}" style="width:${L.pageW}mm;height:${L.pageH}mm;${vars}">${cards}</div></div></div>`;
}

/* ---- auto-fit: shrink text until every panel's content fits its box ---- */
function overflowOf(el){
  const kids=[...el.children].filter(k=>!k.classList.contains("deco")); if(!kids.length) return 0;
  const r=el.getBoundingClientRect(); const sc=r.height/(el.offsetHeight||1);
  const cs=getComputedStyle(el);
  const innerH=r.height-(parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+parseFloat(cs.borderTopWidth)+parseFloat(cs.borderBottomWidth))*sc;
  const innerW=r.width-(parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+parseFloat(cs.borderLeftWidth)+parseFloat(cs.borderRightWidth))*sc;
  let top=Infinity,bot=-Infinity,left=Infinity,right=-Infinity;
  kids.forEach(k=>{const b=k.getBoundingClientRect(); const m=getComputedStyle(k); top=Math.min(top,b.top-parseFloat(m.marginTop)*sc); bot=Math.max(bot,b.bottom+parseFloat(m.marginBottom)*sc); left=Math.min(left,b.left); right=Math.max(right,b.right);});
  return Math.max((bot-top)-innerH,(right-left)-innerW)/sc;
}
function fitPanel(panel){
  panel.style.setProperty("--k","1");
  panel.querySelectorAll("th,td").forEach(c=>c.style.removeProperty("--cf"));
  if(!S.layout.autofit) return;
  const roots=[panel, panel.querySelector(".box"), panel.querySelector(".fields"), panel.querySelector(".gbox"), panel.querySelector(".gtables"), panel.querySelector(".gwrap")].filter(Boolean);
  let k=1;
  for(let i=0;i<40;i++){
    let over=0; roots.forEach(r=>{over=Math.max(over,overflowOf(r));});
    if(over<=0.5) break;
    k=Math.round((k-0.03)*1000)/1000; if(k<0.35) break;
    panel.style.setProperty("--k",String(k));
  }
  panel.querySelectorAll("th:not(.rot),td").forEach(c=>{
    if(!c.textContent.trim()) return;
    let f=1;
    for(let i=0;i<12 && c.scrollWidth>c.clientWidth+0.5;i++){ f-=0.06; c.style.setProperty("--cf",f.toFixed(2)); }
  });
}
function fitAll(root){
  const FIT={};
  root.querySelectorAll(".panel").forEach(p=>{
    const id=p.dataset.pid; let f=FIT[id];
    if(!f){ fitPanel(p); f=FIT[id]={style:p.style.cssText, cells:[...p.querySelectorAll("th,td")].map(c=>c.style.getPropertyValue("--cf"))}; return; }
    p.style.cssText=f.style;
    p.querySelectorAll("th,td").forEach((c,i)=>{ if(f.cells[i]) c.style.setProperty("--cf",f.cells[i]); });
  });
}
function render(){
  const L=physList(); currentSheet=Math.min(currentSheet,L.length-1);
  const ps=L[currentSheet];
  const wrap=document.getElementById("previewWrap");
  wrap.innerHTML=sheetHTML(ps,"front")+sheetHTML(ps,"back");
  fitAll(wrap);
  const total=sheetCount()*perSheet();
  document.getElementById("countInfo").textContent=`${sheetCount()} set${sheetCount()>1?"s":""} × ${perSheet()} = ${total} ${innerSheets()?"booklets":"cards"} · ${L.length} A4 sheet${L.length>1?"s":""} (front + back)`+(S.numbering.autoNo?` · #${cardNumber(0)} – #${cardNumber(total-1)}`:"");
  document.getElementById("sheetInfo").textContent=`Sheet ${currentSheet+1} of ${L.length}`;
  applyZoom();
}
function renderAll(){
  const L=physList(),o=S.print.order,parts=[];
  if(o==="fronts"){L.forEach(ps=>parts.push(sheetHTML(ps,"front")));}
  else if(o==="backs"){L.forEach(ps=>parts.push(sheetHTML(ps,"back")));}
  else if(o==="grouped"){L.forEach(ps=>parts.push(sheetHTML(ps,"front")));L.forEach(ps=>parts.push(sheetHTML(ps,"back")));}
  else {L.forEach(ps=>{parts.push(sheetHTML(ps,"front"));parts.push(sheetHTML(ps,"back"));});}
  const wrap=document.getElementById("previewWrap"); wrap.innerHTML=parts.join(""); fitAll(wrap);
}
function applyZoom(){ const z=parseFloat(document.getElementById("zoom").value);
  document.querySelectorAll(".scaleBox").forEach(b=>{b.style.transform=`scale(${z})`;b.style.width=(S.layout.pageW*z)+"mm";b.style.height=(S.layout.pageH*z)+"mm";}); }

/* ---- toolbar / footer ---- */
document.getElementById("zoom").addEventListener("input",applyZoom);
document.getElementById("prevSheet").addEventListener("click",()=>{currentSheet=Math.max(0,currentSheet-1);render();});
document.getElementById("nextSheet").addEventListener("click",()=>{currentSheet=Math.min(physList().length-1,currentSheet+1);render();});
document.getElementById("printBtn").addEventListener("click",()=>{
  document.body.classList.toggle("nobg",!S.layout.printBg);
  let st=document.getElementById("pageStyle"); if(!st){st=document.createElement("style");st.id="pageStyle";document.head.appendChild(st);}
  st.textContent=`@page{size:${S.layout.pageW}mm ${S.layout.pageH}mm;margin:0}`;
  renderAll(); setTimeout(()=>{window.print();setTimeout(render,300);},100);
});
window.addEventListener("afterprint",render);
document.getElementById("saveBtn").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="duebook-settings.json";a.click();});
document.getElementById("loadBtn").addEventListener("click",()=>document.getElementById("loadFile").click());
document.getElementById("loadFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{loadTemplate(JSON.parse(r.result));}catch(err){infoModal("Invalid file","That file is not a Due Book settings file.");}};r.readAsText(f);});
document.getElementById("resetBtn").addEventListener("click",()=>{askModal({title:"Reset design",warn:true,msg:"Reset everything in the editor to the default <b>Junior High Report Card</b>?<br>Your saved templates are not affected.",ok:"Reset",icon:I.reset}).then(y=>{if(y)loadTemplate(startSettings());});});

document.getElementById("printBtn").innerHTML=I.print+" Print / PDF";
document.getElementById("saveBtn").innerHTML=I.download+" Export";
document.getElementById("loadBtn").innerHTML=I.upload+" Import";
document.getElementById("resetBtn").innerHTML=I.reset+" Reset";
document.getElementById("prevSheet").innerHTML=I.prev;
document.getElementById("nextSheet").innerHTML=I.next;
renderTabs(); renderForm(); render();
/* re-fit once embedded fonts are active and whenever the preview area changes size */
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>render()); }
let rzT; window.addEventListener("resize",()=>{ clearTimeout(rzT); rzT=setTimeout(render,150); });
})();
</script>
