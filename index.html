<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Due Book Generator – 3 cards per A4</title>
<style>
  :root{--ui-bg:#f3f4f6;--ui-panel:#fff;--ui-border:#d1d5db;--accent:#0f766e}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--ui-bg);color:#111}
  #app{display:flex;min-height:100vh}
  #panel{width:400px;flex:0 0 400px;background:var(--ui-panel);border-right:1px solid var(--ui-border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
  #panel header{padding:12px 14px 8px;border-bottom:1px solid var(--ui-border)}
  #panel h1{font-size:17px;margin:0}
  #panel .sub{font-size:11px;color:#555;margin:2px 0 0}
  #tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--ui-border);background:#fafafa}
  #tabs button{padding:5px 8px;font-size:11.5px;border-radius:14px;border:1px solid var(--ui-border);background:#fff;font-weight:600;cursor:pointer}
  #tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #form{padding:10px 14px 20px;overflow-y:auto;flex:1}
  fieldset{border:1px solid var(--ui-border);border-radius:8px;margin:0 0 12px;padding:8px 12px 12px}
  legend{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);padding:0 4px}
  label{display:block;font-size:11.5px;font-weight:600;margin:8px 0 3px;color:#333}
  input[type=text],input[type=number],textarea,select{width:100%;padding:6px 8px;border:1px solid var(--ui-border);border-radius:6px;font-size:13px;font-family:inherit;background:#fff}
  input[type=color]{width:100%;height:32px;padding:2px;border:1px solid var(--ui-border);border-radius:6px;background:#fff}
  input[type=range]{width:100%}
  textarea{resize:vertical;min-height:50px}
  .row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1;min-width:0}
  .check{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;margin:8px 0 0}
  .check input{width:auto;margin:0}.check label{margin:0;font-weight:500}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:flex-end}
  button{cursor:pointer;border:1px solid var(--ui-border);background:#fff;border-radius:6px;padding:7px 11px;font-size:12.5px;font-weight:600}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.small{padding:4px 7px;font-size:11.5px;font-weight:500}
  button.icon{padding:3px 6px;font-size:12px;line-height:1;font-weight:700}
  button.danger{color:#b91c1c}
  .hint{font-size:11px;color:#666;margin-top:4px;line-height:1.4}
  .list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .item{display:flex;gap:4px;align-items:center}
  .item input[type=text]{flex:1;padding:4px 6px;font-size:12px}
  .item input.w{width:52px;flex:0 0 52px;padding:4px 4px;font-size:12px}
  .item select{width:auto;flex:0 0 auto;padding:4px 4px;font-size:11.5px}
  .item .n{font-size:11px;color:#888;width:16px;text-align:right}
  .tpl{border:1px solid var(--ui-border);border-radius:8px;padding:10px 12px;margin-top:8px;background:#fff}
  .tpl.on{border-color:var(--accent);box-shadow:0 0 0 2px #0f766e22}
  .tpl b{font-size:13px}.tpl p{font-size:11.5px;color:#555;margin:4px 0 8px;line-height:1.4}
  #footer{padding:10px 14px;border-top:1px solid var(--ui-border);background:#fafafa}
  #main{flex:1;padding:16px;overflow:auto}
  #toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  #toolbar .spacer{flex:1}#toolbar .info{font-size:13px;color:#444}
  #previewWrap{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .sheetHolder .cap{font-size:12px;font-weight:700;color:#444;margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
  .scaleBox{transform-origin:top left}

  /* ---------- Sheet & card ---------- */
  .sheet{background:#fff;position:relative;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.18);color:var(--ink)}
  .card{position:absolute;display:flex;background:var(--card-bg);font-family:var(--font);color:var(--ink)}
  .sheet.cut .card{outline:0.3mm dashed #999}
  .sheet.cut .fold{position:absolute;left:50%;top:0;bottom:0;border-left:0.3mm dotted #999}
  .card.border{border:var(--card-border) solid var(--line)}
  .panel{width:50%;height:100%;position:relative;display:flex;flex-direction:column;overflow:hidden;overflow-wrap:anywhere}
  .panel.rl{border-left:var(--divider) solid var(--line)}

  .pledge{justify-content:center}
  .pledge h2{margin:0 0 .3em;font-weight:800;letter-spacing:.03em;line-height:1.15}
  .pledge h2.u{text-decoration:underline;text-underline-offset:.12em}
  .pledge p{margin:0;line-height:1.35;white-space:pre-line}

  .cover .box{height:100%;padding:3mm 4mm;display:flex;flex-direction:column;text-align:center}
  .cover .box.b{border:var(--box-w) solid var(--line)}
  .cover .logo{display:block;margin:0 auto 1.5mm}
  .cover .org{font-weight:900;letter-spacing:.02em;line-height:1.1;margin:0}
  .cover .addr{line-height:1.25;margin:1mm 0 0;white-space:pre-line}
  .cover .title{font-weight:800;margin:2.5mm 0 1.5mm;letter-spacing:.02em}
  .cover .fields{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;text-align:left}
  .cover .field{display:flex;align-items:flex-end;gap:1.5mm}
  .cover .field .lab{white-space:nowrap}
  .cover .field .line{flex:1;border-bottom:0.3mm solid var(--line);height:1.2em;position:relative}
  .cover .field .line .val{position:absolute;left:2mm;bottom:0.3mm;font-weight:700}
  .cover .field .after{white-space:nowrap;font-weight:800;font-size:.9em}
  .cover .field.stack{flex-direction:column;align-items:stretch;gap:0}
  .cover .field.stack .top{display:flex;align-items:flex-end;gap:1.5mm}
  .cover .field.stack .under{text-align:center;font-weight:800;font-size:.9em;line-height:1.1;margin-top:.4mm;letter-spacing:.03em}
  .cover .motto{margin:1.5mm 0 0;white-space:pre-line}

  .records h3{margin:0 0 1.5mm;font-weight:900;text-align:center;line-height:1.2}
  .records table{width:100%;border-collapse:collapse;flex:1;table-layout:fixed}
  .records th,.records td{border:var(--tbl-w) solid var(--line);padding:0 1.5mm;line-height:1;overflow:hidden;white-space:nowrap;height:1.5em}
  .records th{font-weight:900;text-align:center;font-size:calc(var(--th-fs) * var(--cf,1))}
  .records th.fill{background:var(--th-bg)}
  .records td{font-size:calc(var(--td-fs) * var(--cf,1))}
  .records td.m{text-align:left}
  .records .yr{white-space:nowrap;font-weight:700}
  .records .yline{display:inline-block;border-bottom:0.3mm solid var(--line);height:1em;vertical-align:baseline;max-width:100%}
  .records .yrow{margin:-0.5mm 0 1.5mm;line-height:1.2}
  .records .cardno{position:absolute;right:3mm;bottom:1mm;font-size:7pt;color:#333}

  /* monthly record grid (offering booklet) */
  .grid .gbox{height:100%;display:flex;flex-direction:column;padding:var(--gpad)}
  .grid .gbox.b{border:var(--box-w) solid var(--line)}
  .grid .gtitle{text-align:center;font-weight:900;margin:0 0 1mm;line-height:1.2}
  .grid .gtables{display:flex;flex:1;gap:var(--ggap);align-items:stretch;min-height:0}
  .grid .gtables.stacked{flex-direction:column}
  .grid .gtables.stacked table{flex:1;height:auto}
  .grid td.lab{text-align:left;padding-left:1mm;font-weight:700;white-space:nowrap;font-size:calc(var(--th-fs) * var(--cf,1))}
  .grid td.mrow{text-align:left;padding-left:1mm;font-weight:700;font-size:calc(var(--th-fs) * var(--cf,1))}
  .grid td.mrow .ml{display:inline-block;width:60%;border-bottom:0.3mm solid var(--line);height:.9em;vertical-align:baseline;margin-left:1mm}
  .grid table{flex:1;width:100%;border-collapse:collapse;table-layout:fixed}
  .grid th,.grid td{border:var(--tbl-w) solid var(--line);padding:0 0.6mm;line-height:1.05;overflow:hidden;white-space:nowrap;height:1.4em}
  .grid th{font-weight:700;text-align:left;font-size:calc(var(--th-fs) * var(--cf,1));vertical-align:bottom;padding-bottom:.3mm}
  .grid th.c{text-align:center}
  .grid th.rot{height:auto;padding:0.8mm 0}
  .grid th.rot span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;white-space:nowrap;line-height:1}
  .grid th.fill{background:var(--th-bg)}
  .grid td{font-size:calc(var(--td-fs) * var(--cf,1))}
  .grid td.first{text-align:left;padding-left:1mm}
  .grid .gnote{font-size:.8em;margin-top:.8mm;text-align:center}

  /* report card */
  .rc .box{height:100%;display:flex;flex-direction:column;padding:3mm 4mm}
  .rc .box.b{border:var(--box-w) solid var(--line)}
  .rc .bl{display:inline-block;border-bottom:0.3mm solid var(--line);height:1em;vertical-align:baseline}
  .rc .org{font-weight:800;text-align:center;margin:0;line-height:1.15}
  .rc .addr{text-align:center;margin:.5mm 0 0;line-height:1.25;white-space:pre-line}
  .rc .title{font-weight:800;text-align:center;margin:2mm 0 1.5mm;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif}
  .rc .frow{display:flex;gap:3mm;margin:2mm 0;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-weight:700}
  .rc .frow .f{flex:1;display:flex;align-items:flex-end;gap:1mm}
  .rc .frow .lab{white-space:nowrap}
  .rc .frow .line{flex:1;border-bottom:0.3mm solid var(--line);height:1.1em}
  .rc .sh{text-align:center;font-weight:800;margin:2.5mm 0 0;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif}
  .rc .sn{margin:.5mm 0 1.5mm;font-weight:700;line-height:1.25;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif}
  .rc table{width:100%;border-collapse:collapse;table-layout:fixed;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif}
  .rc table.fill{flex:1;min-height:0}
  .rc th,.rc td{border:0.3mm solid var(--line);padding:0 1mm;height:1.6em;line-height:1;overflow:hidden;white-space:nowrap;text-align:left;font-weight:700}
  .rc .note{margin:1.5mm 0 0;line-height:1.3;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;text-align:justify}
  .rc .motto{margin-top:auto;padding-top:1.5mm;text-align:center;font-weight:800;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif}
  .rc .ptitle{text-align:center;font-weight:800;margin:4mm 0 3mm;letter-spacing:.02em}
  .rc .pintro{text-align:center;margin:0 0 2.5mm}
  .rc .pbody{margin:0 0 2.5mm;line-height:1.5}
  .rc .popt{margin:0;padding:0;list-style:none}
  .rc .popt li{margin:0 0 1.2mm;line-height:1.45;padding-left:6mm;text-indent:-6mm}
  .rc .psig{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:3mm}
  .rc .psig .sg{width:60%;text-align:center}
  .rc .psig .sg .ln{border-bottom:0.3mm solid var(--line);height:8mm}
  .rc .pdate{margin:4mm 0 0}
  .rc .pnote{margin:3mm 0 0;text-align:center}
  .gr .gwrap{display:flex;align-items:stretch;flex:1;min-height:0}
  .gr table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:calc(var(--g-fs) * var(--cf,1));height:100%}
  .gr th,.gr td{border:var(--tbl-w) solid var(--line);padding:0 1mm;line-height:1.1;overflow:hidden;white-space:nowrap;height:1.55em}
  .gr th{font-weight:700;text-align:center;font-size:calc(var(--gh-fs) * var(--cf,1))}
  .gr th.sem{font-weight:800;border:none;text-align:center;height:1.4em}
  .gr th.sub{text-align:left;font-weight:700}
  .gr th.col{white-space:normal;height:2.6em;line-height:1.1;vertical-align:middle}
  .gr td.s{text-align:left}
  .gr .gfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;margin-top:2mm;flex:0 0 auto}
  .gr .gfoot.bottom{flex:0 0 var(--foot-h)}
  .gr .scale{white-space:pre-line;line-height:1.3;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif}
  .gr .gn{font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-weight:700}
  .free{white-space:pre-line}
  .free h3{margin:0 0 .3em;font-weight:800}
  .free p{margin:0;line-height:1.35}

  @media print{
    body{background:#fff}
    #panel,#toolbar,.cap{display:none !important}
    #app{display:block}#main{padding:0;overflow:visible}#previewWrap{display:block}
    .scaleBox{transform:none !important;width:auto !important;height:auto !important}
    .sheetHolder{page-break-after:always;break-after:page}
    .sheetHolder:last-child{page-break-after:auto;break-after:auto}
    .sheet{box-shadow:none}
    .sheet,.card,.records th,.grid th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body.nobg .card{background:transparent !important}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header><h1>Due Book Generator</h1><p class="sub">Bi‑fold cards &amp; booklets · 3 per A4 front + 3 per A4 back</p></header>
    <nav id="tabs"></nav>
    <div id="form"></div>
    <div id="footer">
      <div class="btns">
        <button class="primary" type="button" id="printBtn">🖨️ Print / Save PDF</button>
        <button type="button" id="saveBtn">Export</button>
        <button type="button" id="loadBtn">Import</button>
        <button type="button" id="resetBtn">Reset</button>
        <input type="file" id="loadFile" accept="application/json" hidden>
      </div>
    </div>
  </aside>
  <main id="main">
    <div id="toolbar">
      <span class="info" id="countInfo"></span><span class="spacer"></span>
      <label style="margin:0;font-size:12px">Zoom</label>
      <input type="range" id="zoom" min="0.25" max="1.2" step="0.05" value="0.5" style="width:120px">
      <button class="small" type="button" id="prevSheet">◀</button>
      <span class="info" id="sheetInfo"></span>
      <button class="small" type="button" id="nextSheet">▶</button>
    </div>
    <div id="previewWrap"></div>
  </main>
</div>

<script>
(function(){
"use strict";
const KEY = "duebook.settings.v3", TKEY = "duebook.templates.v1";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DEFAULTS = {
  template:"due",
  layout:{ pageW:210, pageH:297, perSheet:3, cardW:200, cardH:92, marginTop:5, padX:6, padY:5,
    color:"#cfe8dc", printBg:true, guides:true, cardBorder:0, divider:0,
    font:"Cambria, Georgia, 'Times New Roman', serif", ink:"#111111", line:"#111111", fs:1, autofit:true },
  panels:{
    fl:{type:"pledge", year:2026, yearMode:"blank", custom:{head:"",body:""}},
    fr:{type:"cover",  year:2026, yearMode:"blank", custom:{head:"",body:""}},

    br:{type:"table",  year:2027, yearMode:"blank", custom:{head:"",body:""}},

    title:"MEMBERSHIP DUE & CONTRIBUTION CARD", titleSize:10.5,
    fields:[ {label:"Church:", after:"", pos:"under", fill:"church"}, {label:"Card #:", after:"", pos:"under", fill:"cardno"}, {label:"Signed:", after:"FINANCIAL SECRETARY", pos:"under", fill:"none"} ],

    fields:"Student Name:\nYear: | Class:", fieldSize:10.5,
    signHead:"PARENTS/GUARDIANS", signNote:"Must sign each period as evidence that they have seen the period report.",
    signCols:[ {name:"PERIOD", w:18}, {name:"CLASS SPONSOR", w:41}, {name:"PARENT/GUARDIAN", w:41} ],
    signRows:["I.","II.","III.","IV.","V.","VI"], signSize:10,
    note:"NOTE: When a student’s mark is 70% or below in any student, the parents/guardian should give special attention to see that the student does well in all the work required by the otherwise, the student will probably fail.", noteSize:9.5,

    pOptions:["A.  Promoted to grade __________","B.  Condition in ____________________ and to be given conditional examination in this subject at the opening of the next school year term.","C.  Required to repeat the Grade.","D.  Asked not to enroll next year."],
    pSigns:["Class Sponsor","Principal"], pDate:"Date: ______________ 20______", pNote:"Note: Any erasure on this card makes it invalid", pSize:11.5,
    sem1:"FIRST SEMESTER", sem1Cols:["1st PD.","2nd PD.","3rd PD.","Sem. Exam","Sem. Ave"],
    sem2:"SECOND SEMESTER", sem2Cols:["4th PD","5th PD","6th PD","EXAM","Sem. Ave.","Yrly Ave."],
    subjHead:"SUBJECTS", subjects:["Mathematics","English","Civics","History","Health Science","Literature","Vocabulary","Computer","Phonics","P.E.","Wash In School","R.M.E.","Conduct","Rank","Average"],
    subjW:24, gGap:6, gSize:10, gHeadSize:9.5, gLineW:0.3, gFill:78, signFill:true,
    scale:"97 -100 = EXCELLENT\n90 -96  = Very Good\n80 -89  = Good\n70-79    = Fail Not Encouraging\nBelow 70 = D Failure", scaleSize:10,
    gNote:"Any Grade below 70 will not be honored for promotion", box:true, boxW:0.6 },
  numbering:{ sheets:1, innerSheets:0, autoNo:false, startNo:1, prefix:"", pad:0, churches:"" },
  print:{ order:"interleaved" }
};
const clone = o => JSON.parse(JSON.stringify(o));
const deepMerge = (base, over) => {
  if(Array.isArray(base) || Array.isArray(over)) return over !== undefined ? over : base;
  if(typeof base !== "object" || base === null) return over !== undefined ? over : base;
  const out = {};
  for(const k of new Set([...Object.keys(base), ...Object.keys(over||{})])) out[k] = deepMerge(base[k], over ? over[k] : undefined);
  return out;
};
/* ---------- built-in templates ---------- */
const TEMPLATES = {
  due:{ name:"Membership Due & Contribution Card", desc:"Bi‑fold card: MY PLEDGE + cover on the outside, two monthly DUE / CONTRIBUTION tables (Year: ____) on the inside. 3 cards per A4, front and back.", settings:{} },
  offering:{ name:"Monthly Activities Book (offering & attendance)", desc:"Front A4: 3 covers – Greater Praise Church Int, Inc., MONTHLY ACTIVITIES BOOK, NAME / POSITION / DATE / SIGNED lines and the Mission Statement (left page blank). Back A4: 3 record pages, each with two “Month of:” tables one under the other – Sunday, Tithe, Conference, Death, Programs, Building Fund, Attendance, Total. Add inner sheets in the Pages tab for a thicker stapled book.",
    settings:{ template:"offering",
      layout:{ color:"#ffffff" },
      panels:{ fl:{type:"blank"}, fr:{type:"cover"}, bl:{type:"grid"}, br:{type:"grid"}, il:{type:"grid"}, ir:{type:"grid"} },
      cover:{ org:"Greater Praise Church Int, Inc.", orgCase:"none", orgSize:13,
        addr:"Jamah Town, Brewerville City\nMontserrado County\nR.L. West Africa", addrItalic:true, addrSize:9,
        title:"MONTHLY ACTIVITIES BOOK", titleSize:11,
        fields:[ {label:"", after:"NAME", pos:"under", fill:"none"}, {label:"", after:"POSITION", pos:"under", fill:"none"}, {label:"", after:"DATE", pos:"under", fill:"none"}, {label:"SIGNED:", after:"", pos:"under", fill:"none"} ],

  let v; if(el.dataset.t==="bool") v=el.checked; else if(el.dataset.t==="num") v=el.value===""?"":Number(el.value); else v=el.value;
  set(S,p,v); save(); render();
  if(el.type==="range"){ const lab=el.previousElementSibling; if(lab) lab.textContent=lab.textContent.replace(/\(.*\)$/,`(${v})`); }
});
form.addEventListener("change", e=>{
  const el=e.target, p=el.dataset.p;
  if(p && (/^panels\.\w+\.(type|yearMode)$/.test(p) || p==="grid.layout")) renderForm();
  if(el.id==="logoFile"){ const f=el.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{S.cover.logo=r.result;save();render();}; r.readAsDataURL(f); }
});
form.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return; e.preventDefault();
  if(b.id==="logoClear"){ S.cover.logo=""; save(); render(); return; }
  const act=b.dataset.act; if(!act) return;
  if(act==="tpl"){ const id=b.dataset.id; if(S.template===id && !confirm("Reload this template? Your current changes will be replaced.")) return;
    if(S.template!==id && !confirm(`Switch to “${TEMPLATES[id].name}”? The current design will be replaced.`)) return;
    loadTemplate(Object.assign({template:id},TEMPLATES[id].settings)); return; }
  if(act==="utpl-save"){ const name=(document.getElementById("tplName").value||"").trim(); if(!name){alert("Give the template a name first.");return;}
    const list=userTemplates(); const i=list.findIndex(t=>t.name===name); const entry={name,settings:clone(S)}; if(i>=0) list[i]=entry; else list.push(entry); saveUserTemplates(list); renderForm(); return; }
  if(act==="utpl-load"){ const t=userTemplates()[Number(b.dataset.i)]; if(t && confirm(`Load “${t.name}”? The current design will be replaced.`)) loadTemplate(t.settings); return; }
  if(act==="utpl-del"){ const list=userTemplates(); const t=list[Number(b.dataset.i)]; if(t && confirm(`Delete “${t.name}”?`)){ list.splice(Number(b.dataset.i),1); saveUserTemplates(list); renderForm(); } return; }
  if(act==="months"){ S.table.rows=MONTHS.slice(); }
  else if(act==="numbers"){ S.table.rows=Array.from({length:12},(_,i)=>String(i+1)); }
  else if(act==="gridreset"){ Object.assign(S.grid, clone(DEFAULTS.grid)); }
  else {
    const arr=get(S,b.dataset.arr), i=Number(b.dataset.i);
    if(act==="add"){
      if(b.dataset.arr==="cover.fields") arr.push({label:"Name:",after:"",pos:"under",fill:"none"});
      else if(b.dataset.arr==="table.cols"||b.dataset.arr==="grid.cols"||b.dataset.arr==="report.signCols") arr.push({name:"NEW",w:12});
      else arr.push("");
    } else if(act==="del"){ if(arr.length>1) arr.splice(i,1); }
    else if(act==="up"){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; }
    else if(act==="down"){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; }
  }
  save(); renderForm(); render();
});

/* ---- auto-fit: shrink text until every panel's content fits its box ---- */
function overflowOf(el){
  const kids=[...el.children]; if(!kids.length) return 0;
  const r=el.getBoundingClientRect(); const sc=r.height/(el.offsetHeight||1);
  const cs=getComputedStyle(el);
  const innerH=(el.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom))*sc;
  const innerW=(el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight))*sc;
  let top=Infinity,bot=-Infinity,left=Infinity,right=-Infinity;
  kids.forEach(k=>{const b=k.getBoundingClientRect(); const m=getComputedStyle(k); top=Math.min(top,b.top-parseFloat(m.marginTop)*sc); bot=Math.max(bot,b.bottom+parseFloat(m.marginBottom)*sc); left=Math.min(left,b.left); right=Math.max(right,b.right);});
  return Math.max((bot-top)-innerH,(right-left)-innerW)/sc;
}
function fitPanel(panel){
  panel.style.setProperty("--k","1");
  panel.querySelectorAll("th,td").forEach(c=>c.style.removeProperty("--cf"));
  if(!S.layout.autofit) return;
  const roots=[panel, panel.querySelector(".box"), panel.querySelector(".fields"), panel.querySelector(".gbox"), panel.querySelector(".gtables"), panel.querySelector(".gwrap")].filter(Boolean);
  let k=1;
  for(let i=0;i<40;i++){
    let over=0; roots.forEach(r=>{over=Math.max(over,overflowOf(r));});
    if(over<=0.5) break;
    k=Math.round((k-0.03)*1000)/1000; if(k<0.35) break;
    panel.style.setProperty("--k",String(k));
  }
  panel.querySelectorAll("th:not(.rot),td").forEach(c=>{
    if(!c.textContent.trim()) return;
    let f=1;
    for(let i=0;i<12 && c.scrollWidth>c.clientWidth+0.5;i++){ f-=0.06; c.style.setProperty("--cf",f.toFixed(2)); }
  });
}
function fitAll(root){
  const FIT={};
  root.querySelectorAll(".panel").forEach(p=>{
    const id=p.dataset.pid; let f=FIT[id];
    if(!f){ fitPanel(p); f=FIT[id]={style:p.style.cssText, cells:[...p.querySelectorAll("th,td")].map(c=>c.style.getPropertyValue("--cf"))}; return; }
    p.style.cssText=f.style;
    p.querySelectorAll("th,td").forEach((c,i)=>{ if(f.cells[i]) c.style.setProperty("--cf",f.cells[i]); });
  });
}
function render(){
  const L=physList(); currentSheet=Math.min(currentSheet,L.length-1);
  const ps=L[currentSheet];
  const wrap=document.getElementById("previewWrap");
  wrap.innerHTML=sheetHTML(ps,"front")+sheetHTML(ps,"back");
  fitAll(wrap);
  const total=sheetCount()*perSheet();
  document.getElementById("countInfo").textContent=`${sheetCount()} set${sheetCount()>1?"s":""} × ${perSheet()} = ${total} ${innerSheets()?"booklets":"cards"} · ${L.length} A4 sheet${L.length>1?"s":""} (front + back)`+(S.numbering.autoNo?` · #${cardNumber(0)} – #${cardNumber(total-1)}`:"");
  document.getElementById("sheetInfo").textContent=`Sheet ${currentSheet+1} of ${L.length}`;
  applyZoom();
}
function renderAll(){
  const L=physList(),o=S.print.order,parts=[];
  if(o==="fronts"){L.forEach(ps=>parts.push(sheetHTML(ps,"front")));}
  else if(o==="backs"){L.forEach(ps=>parts.push(sheetHTML(ps,"back")));}
  else if(o==="grouped"){L.forEach(ps=>parts.push(sheetHTML(ps,"front")));L.forEach(ps=>parts.push(sheetHTML(ps,"back")));}
  else {L.forEach(ps=>{parts.push(sheetHTML(ps,"front"));parts.push(sheetHTML(ps,"back"));});}
  const wrap=document.getElementById("previewWrap"); wrap.innerHTML=parts.join(""); fitAll(wrap);
}
function applyZoom(){ const z=parseFloat(document.getElementById("zoom").value);
  document.querySelectorAll(".scaleBox").forEach(b=>{b.style.transform=`scale(${z})`;b.style.width=(S.layout.pageW*z)+"mm";b.style.height=(S.layout.pageH*z)+"mm";}); }

/* ---- toolbar / footer ---- */
document.getElementById("zoom").addEventListener("input",applyZoom);
document.getElementById("prevSheet").addEventListener("click",()=>{currentSheet=Math.max(0,currentSheet-1);render();});
document.getElementById("nextSheet").addEventListener("click",()=>{currentSheet=Math.min(physList().length-1,currentSheet+1);render();});
document.getElementById("printBtn").addEventListener("click",()=>{
  document.body.classList.toggle("nobg",!S.layout.printBg);
  let st=document.getElementById("pageStyle"); if(!st){st=document.createElement("style");st.id="pageStyle";document.head.appendChild(st);}
  st.textContent=`@page{size:${S.layout.pageW}mm ${S.layout.pageH}mm;margin:0}`;
  renderAll(); setTimeout(()=>{window.print();setTimeout(render,300);},100);
});
window.addEventListener("afterprint",render);
document.getElementById("saveBtn").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="duebook-settings.json";a.click();});
document.getElementById("loadBtn").addEventListener("click",()=>document.getElementById("loadFile").click());
document.getElementById("loadFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{loadTemplate(JSON.parse(r.result));}catch(err){alert("Invalid settings file");}};r.readAsText(f);});
document.getElementById("resetBtn").addEventListener("click",()=>{if(confirm("Reset everything to the default Membership Due Card?")){loadTemplate({});}});

renderTabs(); renderForm(); render();
})();
</script>
</body>
</html>
